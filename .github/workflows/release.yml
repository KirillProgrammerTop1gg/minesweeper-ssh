name: Build & Release Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            ext: ""
          - os: windows-latest
            platform: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            platform: macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install textual asyncssh pyinstaller

      - name: Build standalone executable
        run: |
          pyinstaller --onefile --name minesweeper --collect-all textual --collect-all rich main.py

      - name: Package executable and ZIP
        shell: bash
        run: |
          mkdir -p artifacts
          cp "dist/minesweeper${{ matrix.ext }}" "artifacts/minesweeper-${{ matrix.platform }}${{ matrix.ext }}"
          cd dist
          7z a "../artifacts/minesweeper-${{ matrix.platform }}.zip" "minesweeper${{ matrix.ext }}"

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Minesweeper Terminal v1.0.0"
          files: |
            artifacts/minesweeper-${{ matrix.platform }}${{ matrix.ext }}
            artifacts/minesweeper-${{ matrix.platform }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
